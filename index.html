<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E5CDE">
<title>AuditoriaModulos · Clóset Vera</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>

:root{
  --bg:#f4f6fb;--card:#fff;--ink:#1b2030;--sub:#6b7280;--line:#e6e9f2;
  --brand:#3E5CDE;--brand-2:#2c46b8;--brand-ink:#fff;
  --accent:#FF6B6A;--yellow:#FFD34D;
  --ok:#1f9d55;--bad:#e0453f;
  --shadow:0 1px 2px rgba(20,25,50,.04), 0 4px 14px rgba(20,25,50,.06);
  --shadow-btn:0 2px 8px rgba(62,92,222,.28);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11131b;--card:#1a1d29;--ink:#eef0f7;--sub:#9aa1b8;--line:#2a2e40;--shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--bg:#11131b;--card:#1a1d29;--ink:#eef0f7;--sub:#9aa1b8;--line:#2a2e40;--shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;padding:12px 14px calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);z-index:6;box-shadow:0 2px 10px rgba(20,30,80,.18)}
header h1{margin:0;font-size:16px}
select#moduloSel{width:100%;margin-top:6px;padding:8px;border-radius:10px;border:none;font-weight:700;background:rgba(255,255,255,.16);color:var(--brand-ink)}
select#moduloSel option{color:#000}
nav{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:122px;z-index:5;box-shadow:0 2px 6px rgba(20,25,50,.04)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:40px;padding:9px 15px;border:none;border-radius:999px;background:transparent;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
nav button.active{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 8px rgba(62,92,222,.35)}
nav button:active{transform:scale(.96)}
nav button.soon{opacity:.45}
main{max-width:760px;margin:0 auto;padding:16px 14px calc(32px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
input,select{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px;transition:border-color .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(62,92,222,.15)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:10.5px;color:var(--sub);margin-left:5px;font-weight:600}
button.btn{min-height:48px;padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);font-weight:700;cursor:pointer;font-size:15px;box-shadow:var(--shadow-btn);transition:transform .1s ease,filter .15s ease;-webkit-tap-highlight-color:transparent}
button.btn:active{transform:scale(.97);filter:brightness(.96)}
button.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
button.small{min-height:40px;padding:9px 14px;font-size:12.5px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--sub);font-size:12.5px;margin-top:5px;line-height:1.5}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrap-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px;width:calc(100% + 32px)}
h3{margin:0 0 10px;font-size:14.5px;font-weight:800;letter-spacing:.1px}
.warn{background:#fdf1e3;border:1px solid #e6c88a;border-left:4px solid #d99a2b;color:#7a4f13;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;line-height:1.5}
:root[data-theme="dark"] .warn, @media (prefers-color-scheme: dark){.warn{background:#332711;border-color:#6b4f1f;color:#e8c98a}}
.subtabs{display:flex;gap:6px;margin-bottom:10px;background:var(--bg);padding:4px;border-radius:12px}
.subtabs button{flex:1;min-height:40px;padding:9px;border-radius:9px;border:none;background:transparent;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s ease,color .15s ease;-webkit-tap-highlight-color:transparent}
.subtabs button.active{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 6px rgba(62,92,222,.3)}
@media (max-width:380px){
  .pickergrid{gap:10px}
  .modcard{padding:14px;min-height:112px}
  .modbadge{width:38px;height:38px;margin-bottom:22px}
  main{padding-left:12px;padding-right:12px}
  .card{padding:14px}
}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.15);display:block}
.brandname{font-weight:800;font-size:15px;letter-spacing:.6px;line-height:1.1}
.brandsub{font-size:11px;opacity:.85}
.modbar{margin-top:8px}
.modpill{border:none;color:#fff;padding:8px 12px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pickerTitle{font-size:20px;font-weight:800;margin:6px 2px 14px;letter-spacing:.1px}
.pickergrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modcard{border-radius:18px;padding:16px;color:#fff;cursor:pointer;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;border:none;text-align:left;font-family:inherit;box-shadow:0 4px 16px rgba(20,25,50,.16);transition:transform .1s ease;-webkit-tap-highlight-color:transparent}
.modcard:active{transform:scale(.97)}
.modbadge{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;margin-bottom:28px}
.modbadge span{font-size:8.5px;font-weight:700;letter-spacing:.3px}
.modname{font-weight:800;font-size:17px}
.modregion{font-size:12px;opacity:.85}

header .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
#whoami{font-size:11px;opacity:.9;font-weight:600}
#logoutBtn{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:9px;padding:8px 12px;font-size:11.5px;font-weight:700;cursor:pointer;min-height:32px;-webkit-tap-highlight-color:transparent}
#syncBadge{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}

/* ===== Diseño sencillo para uso en el día (Inicio, inventario, anotar) ===== */
.hello{font-size:22px;font-weight:800;margin:4px 2px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:none;border-radius:18px;padding:16px 14px;min-height:128px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);border-top:5px solid var(--tc);font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s ease}
.tile:active{transform:scale(.97)}
.tile-ic{font-size:32px;line-height:1}
.tile-t{font-size:16px;font-weight:800;margin-top:6px}
.tile-s{font-size:12.5px;color:var(--sub);line-height:1.35}
.pend{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;font-size:14px;line-height:1.45}
.pend + .pend{border-top:1px solid var(--line)}
.pend .btn{flex:0 0 auto}
.aviso{border:2px solid var(--accent);background:linear-gradient(0deg,rgba(255,107,106,.06),rgba(255,107,106,.06)),var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 14px;min-height:42px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--shadow-btn)}
.bignum{font-size:24px;font-weight:800;margin-top:2px}
.invlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.invitem{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.invitem.vacio{opacity:.55}
.invname{font-weight:700;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis}
.invqty{font-size:22px;font-weight:800;color:var(--brand);text-align:right;white-space:nowrap}
.invqty span{display:block;font-size:11px;font-weight:600;color:var(--sub)}
.paso{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:13px;margin-right:8px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipobtn{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;min-height:64px;font-family:inherit;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tipobtn small{color:var(--sub);font-size:11.5px;line-height:1.3}
.tipobtn.on{border-color:var(--brand);background:rgba(62,92,222,.1)}
.tipobtn.menor{grid-column:1 / -1;min-height:52px;opacity:.85}
.tipo-ic{font-size:24px}
.movlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.movitem{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.movitem input{width:96px;flex:0 0 96px;text-align:center;font-size:18px;font-weight:700;background:var(--card)}
details.card summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;pointer-events:none;background:#1f9d55;color:#fff;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px);text-align:center;transition:all .25s ease}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
@media (max-width:360px){ .tiles,.tipos{gap:8px} .tile{min-height:116px;padding:14px 12px} .tile-ic{font-size:28px} }
.subcard .card{box-shadow:none;border:none;padding:0;margin:0;background:transparent}
details.card > summary{list-style:none}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:'▾';margin-left:auto;color:var(--sub);font-size:14px}
details.card[open] > summary::after{content:'▴'}
#upd-banner{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1b2030;color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#upd-banner button{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand"><img class="logo" src="logo-badge.png" alt="Closets Vera"><div><div class="brandname">CLOSETS VERA</div><div class="brandsub">Auditoría de Módulos</div></div></div>
    <div style="text-align:right">
      <div id="whoami"></div>
      <button id="logoutBtn">Salir</button>
    </div>
  </div>
  <div id="modbar" class="modbar"></div>
  <div id="syncBadge"></div>
</header>
<nav id="nav">
  <button data-v="home" class="active">🏠 Inicio</button>
  <button data-v="inv">📦 Inventario</button>
  <button data-v="mov">✍️ Anotar</button>
  <button data-v="inst">🔧 Instalación</button>
  <button data-v="gar">🛡️ Garantías</button>
  <button data-v="trasp">🔄 Traspasos</button>
  <button data-v="rep">📊 Reportes</button>
  <button data-v="aud">📋 Auditoría</button>
  <button data-v="hist">🗂️ Historial</button>
  <button data-v="apr">✅ Aprobaciones</button>
  <button data-v="desp">📐 Despiece</button>
  <button data-v="cat">📚 Catálogo</button>
  <button data-v="usr">👥 Usuarios</button>
</nav>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.6/dist/dexie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script type="module" src="bootstrap.js"></script>
<script>
// Actualización automática: busca versión nueva al abrir, al volver a la app y cada 30 min.
// Cuando llega una versión nueva, recarga sola si no estás capturando nada; si estás a media
// captura, muestra un aviso con botón "Actualizar" para no perder lo que escribiste.
if ('serviceWorker' in navigator) {
  const habiaVersion = !!navigator.serviceWorker.controller;
  let recargando = false;
  function hayCapturaEnCurso(){
    const vista = (typeof current !== 'undefined') ? current : '';
    if(['mov','inst','gar','aud','ini','trasp','usr'].includes(vista)){
      return [...document.querySelectorAll('#main input')].some(i => (i.type==='checkbox' ? false : String(i.value||'').trim()!=='' && i.type!=='date'));
    }
    return false;
  }
  function recargar(){ if(recargando) return; recargando = true; location.reload(); }
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!habiaVersion) return; // primera instalación: no hace falta recargar
    if(document.visibilityState === 'hidden' || !hayCapturaEnCurso()) return recargar();
    let b = document.getElementById('upd-banner');
    if(!b){
      b = document.createElement('div'); b.id = 'upd-banner';
      b.innerHTML = '🔄 Hay una versión nueva de la app. <button onclick="location.reload()">Actualizar</button>';
      document.body.appendChild(b);
    }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      reg.update();
      setInterval(() => reg.update(), 30*60*1000);
      document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update(); });
    });
  });
}
</script>
</body>
</html>
